name: Spring Boot CI

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Login GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
          -u "${{ secrets.GHCR_USERNAME }}" \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t ghcr.io/hiteshguptagt/hello-spring:${{ github.run_number }} \
          .

      - name: Push Image
        run: |
          docker push \
          ghcr.io/hiteshguptagt/hello-spring:${{ github.run_number }}

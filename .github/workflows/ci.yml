name: Spring Boot CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build Spring Boot JAR
        run: mvn clean package

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/hiteshguptagt/hello-spring:latest \
            -t ghcr.io/hiteshguptagt/hello-spring:${IMAGE_TAG} \
            .

      - name: Push Latest Image
        run: |
          docker push ghcr.io/hiteshguptagt/hello-spring:latest

      - name: Push SHA Image
        run: |
          docker push ghcr.io/hiteshguptagt/hello-spring:${IMAGE_TAG}

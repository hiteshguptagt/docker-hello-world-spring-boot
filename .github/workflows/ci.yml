name: Spring Boot CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build Spring Boot JAR
        run: mvn clean package

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/hiteshguptagt/hello-spring:latest \
            -t ghcr.io/hiteshguptagt/hello-spring:${IMAGE_TAG} \
            .

      - name: Push Latest Image
        run: |
          docker push ghcr.io/hiteshguptagt/hello-spring:latest

      - name: Push SHA Image
        run: |
          docker push ghcr.io/hiteshguptagt/hello-spring:${IMAGE_TAG}

      - name: Update GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/hiteshguptagt/hello-world-gitops.git
          
          cd hello-world-gitops

          sed -i "s|image: ghcr.io/hiteshguptagt/hello-spring:.*|image: ghcr.io/hiteshguptagt/hello-spring:${IMAGE_TAG}|" \
            workloads/hello-world/base/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add workloads/hello-world/base/deployment.yaml
          git commit -m "Update hello-spring image to ${IMAGE_TAG}"
          git push origin main
